<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <h1 class="mb-4">Products</h1>

    <form class="row g-3 mb-4" id="searchForm">
      <div class="col-auto">
        <input type="text" class="form-control" id="searchInput" placeholder="Search products...">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-outline-primary">Search</button>
        <a href="/products.html" class="btn btn-outline-secondary">Clear</a>
      </div>
    </form>

    <div id="loading" class="text-center d-none">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="productsGrid" class="row"></div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast, getUser } from "/js/auth.js";

    const grid = document.getElementById("productsGrid");
    const loading = document.getElementById("loading");

    async function loadProducts(search = "") {
      loading.classList.remove("d-none");
      grid.innerHTML = "";

      try {
        const url = search ? `/api/products?search=${encodeURIComponent(search)}` : "/api/products";
        const res = await fetch(url);
        const data = await res.json();

        if (data.data.length === 0) {
          grid.innerHTML = '<div class="col-12 text-center text-muted">No products found</div>';
        } else {
          data.data.forEach((product) => {
            const col = document.createElement("div");
            col.className = "col-md-4 mb-4";
            col.innerHTML = `
              <div class="card h-100">
                ${product.image ? `<img src="${product.image}" class="card-img-top" alt="${product.name}" style="height:200px;object-fit:cover;">` : '<div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height:200px;"><span class="text-muted">No Image</span></div>'}
                <div class="card-body d-flex flex-column">
                  <h5 class="card-title">${product.name}</h5>
                  <p class="card-text text-muted small flex-grow-1">${product.description.substring(0, 80)}${product.description.length > 80 ? "..." : ""}</p>
                  <p class="card-text fw-bold">$${product.price.toFixed(2)}</p>
                  <div class="d-flex gap-2">
                    <a href="/product.html?id=${product.id}" class="btn btn-outline-primary btn-sm">View Details</a>
                    <button class="btn btn-primary btn-sm add-to-cart-btn" data-id="${product.id}" data-name="${product.name}" data-description="${product.description}" data-price="${product.price}" data-image="${product.image || ""}">Add to Cart</button>
                  </div>
                </div>
              </div>
            `;
            grid.appendChild(col);
          });

          document.querySelectorAll(".add-to-cart-btn").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const user = getUser();
              if (!user || user.role !== "customer") {
                showToast("Please login as a customer to add to cart", "warning");
                return;
              }

              const product = {
                id: btn.dataset.id,
                name: btn.dataset.name,
                description: btn.dataset.description,
                price: parseFloat(btn.dataset.price),
                image: btn.dataset.image,
                quantity: 1,
              };

              try {
                const res = await fetch("/api/cart", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(product),
                });

                const data = await res.json();
                if (res.ok) {
                  showToast(data.message, "success");
                } else {
                  showToast(data.error || "Failed to add to cart", "danger");
                }
              } catch {
                showToast("Something went wrong", "danger");
              }
            });
          });
        }
      } catch {
        grid.innerHTML = '<div class="col-12 text-center text-danger">Failed to load products</div>';
      }

      loading.classList.add("d-none");
    }

    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const search = document.getElementById("searchInput").value;
      loadProducts(search);
    });

    const urlParams = new URLSearchParams(window.location.search);
    const initialSearch = urlParams.get("search") || "";
    if (initialSearch) {
      document.getElementById("searchInput").value = initialSearch;
    }
    loadProducts(initialSearch);
  </script>
</body>
</html>
