<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">New Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h1 class="mb-4" id="formTitle">New Product</h1>
        <form id="productForm">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" required>
            <div id="nameError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3" required></textarea>
            <div id="descriptionError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" class="form-control" id="price" step="0.01" min="0.01" required>
            <div id="priceError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="image" class="form-label">Image URL (optional)</label>
            <input type="url" class="form-control" id="image" placeholder="https://...">
            <div id="imageError" class="text-danger small d-none"></div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="submitBtn">Create Product</button>
            <a href="/merchant/products.html" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast, setLoading, clearErrors, showFieldErrors } from "/js/auth.js";

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    const isEdit = !!productId;

    const formTitle = document.getElementById("formTitle");
    const pageTitle = document.getElementById("pageTitle");
    const submitBtn = document.getElementById("submitBtn");

    if (isEdit) {
      formTitle.textContent = "Edit Product";
      pageTitle.textContent = "Edit Product";
      submitBtn.textContent = "Update Product";
    }

    async function loadProduct() {
      if (!productId) return;

      try {
        const res = await fetch(`/api/products/${productId}`);
        const data = await res.json();

        if (res.ok) {
          const product = data.data;
          document.getElementById("name").value = product.name;
          document.getElementById("description").value = product.description;
          document.getElementById("price").value = product.price;
          document.getElementById("image").value = product.image || "";
        } else {
          showToast("Product not found", "danger");
          setTimeout(() => {
            window.location.href = "/merchant/products.html";
          }, 1000);
        }
      } catch {
        showToast("Failed to load product", "danger");
      }
    }

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const body = {
        name: document.getElementById("name").value,
        description: document.getElementById("description").value,
        price: parseFloat(document.getElementById("price").value),
        image: document.getElementById("image").value || "",
      };

      setLoading(submitBtn, true);

      try {
        const url = isEdit ? `/api/products/${productId}` : "/api/products";
        const method = isEdit ? "PATCH" : "POST";

        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          if (data.errors) {
            showFieldErrors(data.errors);
          } else {
            showToast(data.error || "Failed to save product", "danger");
          }
          setLoading(submitBtn, false);
          return;
        }

        showToast(data.message, "success");
        setTimeout(() => {
          window.location.href = "/merchant/products.html";
        }, 1000);
      } catch {
        showToast("Something went wrong", "danger");
        setLoading(submitBtn, false);
      }
    });

    loadProduct();
  </script>
</body>
</html>
