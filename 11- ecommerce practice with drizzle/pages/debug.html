<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug - Database Dump</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Database Dump</h1>
    <p class="text-muted mb-3">Live view of data.json</p>
    <button class="btn btn-primary mb-3" id="refreshBtn">Refresh</button>
    <pre id="dbOutput" class="bg-light p-4 border rounded" style="max-height:80vh;overflow:auto;">Loading...</pre>
  </div>

  <script>
    async function loadDb() {
      try {
        const res = await fetch("/api/debug");
        const data = await res.json();
        document.getElementById("dbOutput").textContent = JSON.stringify(data, null, 2);
      } catch {
        document.getElementById("dbOutput").textContent = "Failed to load database";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadDb);
    loadDb();
  </script>
</body>
</html>
