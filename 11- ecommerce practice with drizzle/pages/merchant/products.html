<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>My Products</h1>
      <a href="/merchant/product-form.html" class="btn btn-primary">+ New Product</a>
    </div>

    <div id="loading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="noProducts" class="d-none text-center">
      <p class="lead text-muted">No products yet</p>
      <a href="/merchant/product-form.html" class="btn btn-primary">Create your first product</a>
    </div>

    <div id="productsContent" class="d-none">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast } from "/js/auth.js";

    const productsBody = document.getElementById("productsBody");
    const loading = document.getElementById("loading");
    const noProducts = document.getElementById("noProducts");
    const productsContent = document.getElementById("productsContent");

    async function loadProducts() {
      loading.classList.remove("d-none");

      try {
        const res = await fetch("/api/products");
        const data = await res.json();

        loading.classList.add("d-none");

        if (data.data.length === 0) {
          noProducts.classList.remove("d-none");
          return;
        }

        productsBody.innerHTML = "";

        data.data.forEach((product) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${product.name}</td>
            <td>${product.description.substring(0, 50)}${product.description.length > 50 ? "..." : ""}</td>
            <td>$${product.price.toFixed(2)}</td>
            <td>
              <a href="/merchant/product-form.html?id=${product.id}" class="btn btn-outline-primary btn-sm">Edit</a>
              <button class="btn btn-danger btn-sm delete-btn" data-id="${product.id}" data-name="${product.name}">Delete</button>
            </td>
          `;
          productsBody.appendChild(row);
        });

        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm(`Are you sure you want to delete "${btn.dataset.name}"?`)) {
              return;
            }

            try {
              const res = await fetch(`/api/products/${btn.dataset.id}`, { method: "DELETE" });
              if (res.ok) {
                showToast("Product deleted", "success");
                loadProducts();
              } else {
                const data = await res.json();
                showToast(data.error || "Failed to delete", "danger");
              }
            } catch {
              showToast("Something went wrong", "danger");
            }
          });
        });

        productsContent.classList.remove("d-none");
      } catch {
        loading.classList.add("d-none");
        showToast("Failed to load products", "danger");
      }
    }

    loadProducts();
  </script>
</body>
</html>
