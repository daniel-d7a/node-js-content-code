<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <h1 class="mb-4">Shopping Cart</h1>

    <div id="loading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="emptyCart" class="d-none text-center">
      <p class="lead text-muted">Your cart is empty</p>
      <a href="/products.html" class="btn btn-primary">Browse Products</a>
    </div>

    <div id="cartContent" class="d-none">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Subtotal</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="cartBody"></tbody>
          <tfoot>
            <tr>
              <td colspan="3" class="text-end fw-bold">Total:</td>
              <td class="fw-bold" id="cartTotal"></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="d-flex justify-content-between">
        <a href="/products.html" class="btn btn-outline-secondary">Continue Shopping</a>
        <button class="btn btn-success btn-lg" id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast, setLoading } from "/js/auth.js";

    const cartBody = document.getElementById("cartBody");
    const cartTotal = document.getElementById("cartTotal");
    const loading = document.getElementById("loading");
    const emptyCart = document.getElementById("emptyCart");
    const cartContent = document.getElementById("cartContent");
    const checkoutBtn = document.getElementById("checkoutBtn");

    async function loadCart() {
      loading.classList.remove("d-none");
      cartContent.classList.add("d-none");
      emptyCart.classList.add("d-none");

      try {
        const res = await fetch("/api/cart");
        const data = await res.json();
        const cart = data.data;

        loading.classList.add("d-none");

        if (!cart.products || cart.products.length === 0) {
          emptyCart.classList.remove("d-none");
          return;
        }

        cartBody.innerHTML = "";
        let total = 0;

        cart.products.forEach((product) => {
          const subtotal = product.price * product.quantity;
          total += subtotal;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>
              <div class="d-flex align-items-center">
                ${product.image ? `<img src="${product.image}" alt="${product.name}" style="width:50px;height:50px;object-fit:cover;" class="me-3 rounded">` : ""}
                <div>
                  <strong>${product.name}</strong>
                </div>
              </div>
            </td>
            <td>$${product.price.toFixed(2)}</td>
            <td>
              <div class="input-group" style="width:140px;">
                <button class="btn btn-outline-secondary btn-sm qty-decrease" data-id="${product.id}">-</button>
                <input type="number" class="form-control form-control-sm text-center qty-input" value="${product.quantity}" min="1" data-id="${product.id}">
                <button class="btn btn-outline-secondary btn-sm qty-increase" data-id="${product.id}">+</button>
              </div>
            </td>
            <td>$${subtotal.toFixed(2)}</td>
            <td>
              <button class="btn btn-danger btn-sm delete-btn" data-id="${product.id}">Delete</button>
            </td>
          `;
          cartBody.appendChild(row);
        });

        cartTotal.textContent = `$${total.toFixed(2)}`;
        cartContent.classList.remove("d-none");

        document.querySelectorAll(".qty-decrease").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const input = document.querySelector(`.qty-input[data-id="${btn.dataset.id}"]`);
            const newQty = Math.max(1, parseInt(input.value) - 1);
            await updateQuantity(btn.dataset.id, newQty);
          });
        });

        document.querySelectorAll(".qty-increase").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const input = document.querySelector(`.qty-input[data-id="${btn.dataset.id}"]`);
            const newQty = parseInt(input.value) + 1;
            await updateQuantity(btn.dataset.id, newQty);
          });
        });

        document.querySelectorAll(".qty-input").forEach((input) => {
          input.addEventListener("change", async () => {
            const newQty = Math.max(1, parseInt(input.value));
            await updateQuantity(input.dataset.id, newQty);
          });
        });

        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              const res = await fetch(`/api/cart/${btn.dataset.id}`, { method: "DELETE" });
              const data = await res.json();
              if (res.ok) {
                showToast(data.message, "success");
                loadCart();
              } else {
                showToast(data.error || "Failed to remove", "danger");
              }
            } catch {
              showToast("Something went wrong", "danger");
            }
          });
        });
      } catch {
        loading.classList.add("d-none");
        showToast("Failed to load cart", "danger");
      }
    }

    async function updateQuantity(productId, quantity) {
      try {
        const res = await fetch(`/api/cart/${productId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ quantity }),
        });
        if (res.ok) {
          loadCart();
        }
      } catch {
        showToast("Something went wrong", "danger");
      }
    }

    checkoutBtn.addEventListener("click", async () => {
      setLoading(checkoutBtn, true);
      try {
        const res = await fetch("/api/orders/checkout", { method: "POST" });
        const data = await res.json();

        if (res.ok) {
          showToast(data.message, "success");
          setTimeout(() => {
            window.location.href = "/orders.html";
          }, 1000);
        } else {
          showToast(data.error || "Checkout failed", "danger");
          setLoading(checkoutBtn, false);
        }
      } catch {
        showToast("Something went wrong", "danger");
        setLoading(checkoutBtn, false);
      }
    });

    loadCart();
  </script>
</body>
</html>
