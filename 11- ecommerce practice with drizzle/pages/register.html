<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="mb-4">Register</h1>
        <form id="registerForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required>
            <div id="usernameError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
            <div id="emailError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
            <div id="passwordError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="password_confirmation" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="password_confirmation" required>
            <div id="password_confirmationError" class="text-danger small d-none"></div>
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">I want to be a</label>
            <select class="form-select" id="role" required>
              <option value="customer">Customer</option>
              <option value="merchant">Merchant</option>
            </select>
            <div id="roleError" class="text-danger small d-none"></div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast, setLoading, clearErrors, showFieldErrors } from "/js/auth.js";

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const password_confirmation = document.getElementById("password_confirmation").value;
      const role = document.getElementById("role").value;
      const btn = e.target.querySelector("button[type=submit]");

      setLoading(btn, true);

      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password, password_confirmation, role }),
        });

        const data = await res.json();

        if (!res.ok) {
          if (data.errors) {
            showFieldErrors(data.errors);
          } else {
            showToast(data.error, "danger");
          }
          setLoading(btn, false);
          return;
        }

        showToast(data.message, "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1000);
      } catch {
        showToast("Something went wrong. Please try again.", "danger");
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
