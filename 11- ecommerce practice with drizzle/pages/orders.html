<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <h1 class="mb-4">My Orders</h1>

    <div id="loading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="noOrders" class="d-none text-center">
      <p class="lead text-muted">You have no orders yet</p>
      <a href="/products.html" class="btn btn-primary">Browse Products</a>
    </div>

    <div id="ordersContent" class="d-none">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast } from "/js/auth.js";

    const ordersBody = document.getElementById("ordersBody");
    const loading = document.getElementById("loading");
    const noOrders = document.getElementById("noOrders");
    const ordersContent = document.getElementById("ordersContent");

    async function loadOrders() {
      loading.classList.remove("d-none");

      try {
        const res = await fetch("/api/orders");
        const data = await res.json();

        loading.classList.add("d-none");

        if (data.data.length === 0) {
          noOrders.classList.remove("d-none");
          return;
        }

        ordersBody.innerHTML = "";

        data.data.forEach((order) => {
          const row = document.createElement("tr");
          const itemsSummary = order.products
            .map((p) => `${p.name} x${p.quantity}`)
            .join(", ");
          const date = new Date(order.createdAt).toLocaleDateString();

          row.innerHTML = `
            <td>${order.id}</td>
            <td>${itemsSummary}</td>
            <td>$${order.total.toFixed(2)}</td>
            <td><span class="badge bg-warning text-dark">${order.status}</span></td>
            <td>${date}</td>
          `;
          ordersBody.appendChild(row);
        });

        ordersContent.classList.remove("d-none");
      } catch {
        loading.classList.add("d-none");
        showToast("Failed to load orders", "danger");
      }
    }

    loadOrders();
  </script>
</body>
</html>
