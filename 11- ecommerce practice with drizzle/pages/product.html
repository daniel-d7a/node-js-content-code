<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <div id="loading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="productDetail" class="d-none">
      <div class="row">
        <div class="col-md-6">
          <div id="productImage" class="bg-light d-flex align-items-center justify-content-center" style="height:400px;">
            <span class="text-muted">No Image</span>
          </div>
        </div>
        <div class="col-md-6">
          <h1 id="productName"></h1>
          <p class="lead text-muted" id="productDescription"></p>
          <h3 class="text-primary" id="productPrice"></h3>
          <button class="btn btn-primary btn-lg mt-3" id="addToCartBtn">Add to Cart</button>
          <a href="/products.html" class="btn btn-outline-secondary btn-lg mt-3 ms-2">Back to Products</a>
        </div>
      </div>
    </div>

    <div id="notFound" class="d-none text-center">
      <h2>Product not found</h2>
      <a href="/products.html" class="btn btn-primary mt-3">Back to Products</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast, getUser } from "/js/auth.js";

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    async function loadProduct() {
      if (!productId) {
        document.getElementById("loading").classList.add("d-none");
        document.getElementById("notFound").classList.remove("d-none");
        return;
      }

      try {
        const res = await fetch(`/api/products/${productId}`);
        const data = await res.json();

        document.getElementById("loading").classList.add("d-none");

        if (!res.ok) {
          document.getElementById("notFound").classList.remove("d-none");
          return;
        }

        const product = data.data;
        document.getElementById("productName").textContent = product.name;
        document.getElementById("productDescription").textContent = product.description;
        document.getElementById("productPrice").textContent = `$${product.price.toFixed(2)}`;

        if (product.image) {
          document.getElementById("productImage").innerHTML =
            `<img src="${product.image}" alt="${product.name}" style="max-width:100%;max-height:400px;object-fit:contain;">`;
        }

        document.getElementById("productDetail").classList.remove("d-none");

        document.getElementById("addToCartBtn").addEventListener("click", async () => {
          const user = getUser();
          if (!user || user.role !== "customer") {
            showToast("Please login as a customer to add to cart", "warning");
            return;
          }

          const cartItem = {
            id: product.id,
            name: product.name,
            description: product.description,
            price: product.price,
            image: product.image || "",
            quantity: 1,
          };

          try {
            const cartRes = await fetch("/api/cart", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(cartItem),
            });

            const cartData = await cartRes.json();
            if (cartRes.ok) {
              showToast(cartData.message, "success");
            } else {
              showToast(cartData.error || "Failed to add to cart", "danger");
            }
          } catch {
            showToast("Something went wrong", "danger");
          }
        });
      } catch {
        document.getElementById("loading").classList.add("d-none");
        document.getElementById("notFound").classList.remove("d-none");
      }
    }

    loadProduct();
  </script>
</body>
</html>
